services:

  postgres:
    image: postgres:16
    container_name: hrportal-postgres

    restart: always

    environment:
      POSTGRES_DB: ${DB_NAME:-hr_portal}
      POSTGRES_USER: ${DB_USERNAME:-hradmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hrpassword}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-hradmin} -d ${DB_NAME:-hr_portal}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend/hrportal

    container_name: hrportal-backend

    restart: always

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hr_portal}
      DB_USERNAME: ${DB_USERNAME:-hradmin}
      DB_PASSWORD: ${DB_PASSWORD:-hrpassword}

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

  frontend:
    build: ./frontend

    container_name: hrportal-frontend

    restart: always

    depends_on:
      - backend

    ports:
      - "3000:80"

volumes:
  postgres-data:
    name: hr-postgres-data